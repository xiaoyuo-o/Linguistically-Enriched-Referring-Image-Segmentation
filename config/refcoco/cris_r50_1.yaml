DATA:

  dataset: refcoco
  train_lmdb: /data1/gxy/CRIS_data/data_raw/lmdb/refcoco/train.lmdb
  new_train_lmdb: /data1/gxy/CRIS_data/data_new/lmdb/refcoco/train.lmdb
  train_split: train
  val_lmdb: /data1/gxy/CRIS_data/data_raw/lmdb/refcoco/val.lmdb
  val_split: val
  new_val_lmdb: /data1/gxy/CRIS_data/data_new/lmdb/refcoco/val.lmdb
  mask_root: /data1/gxy/CRIS_data/data_raw/masks/refcoco
  data_root: /data1/gxy/dataset/dataset
  split: unc
  is_decouple: False
  if_two_branches: False
  type: raw

aug:
  num_bgs: 4
  blur: False
  t2i_only: True
  fp_restrict: False
  aug_prob: 0.6
  retrieval_epoch: 12
  mix_grid: False
  rand_prob: 0.3
  retr_prob: 0.3
  top_k: 800
  move_crs_pnt: False
  rand_crs: False
  i2i_sim_thres: 0.85
  t2i_sim_thres: 0.25
  
TRAIN:
  # Base Arch
  clip_pretrain: /data1/gxy/project/the_most_raw/CRIS.pytorch-master/pretrain/RN50.pt
  input_size: 416
  word_len: 60
  word_en_length: 60
  word_dim: 1024
  vis_dim: 512
  fpn_in: [512, 1024, 1024]
  fpn_out: [256, 512, 1024]
  sync_bn: True
  # Decoder
  num_layers: 3
  num_head: 8
  dim_ffn: 2048
  dropout: 0.1
  intermediate: False
  # Training Setting
  workers: 16 # data loader workers
  workers_val: 16
  epochs: 50
  milestones: [35]
  start_epoch: 0
  batch_size: 32 # batch size for training
  batch_size_val: 64 # batch size for validation during training, memory and speed tradeoff
  base_lr: 0.00005
  lr_decay: 0.1
  lr_multi: 0.1
  weight_decay: 0.
  max_norm: 0.
  manual_seed: 0
  print_freq: 100
  # Resume & Save
  exp_name: CRIS/baseline
  #exp_parse_dim_lr0.00005_with_txt_loss:加了视觉感知的文本的对比损失
  output_folder: exp_test/oIou/refcoco
  save_freq: 1
  weight:  # path to initial weight (default: none)
  resume:  # /data1/gxy/project/CRIS.pytorch-master_text1_2cross_att_both_parse/exp_two_branches_parse_NeMo/refcoco/CRIS_R101/correct_1/last_model.pth
  evaluate: True  # evaluate on validation set, extra gpu memory needed and small batch_size_val is recommend
Distributed:
  dist_url: tcp://localhost:2345
  dist_backend: 'nccl'
  multiprocessing_distributed: True
  world_size: 1
  rank: 0
TEST:
  test_split: val
  test_lmdb: /data1/gxy/CRIS_data/data_raw/lmdb/refcoco/val.lmdb
  val_split: val
  visualize: False